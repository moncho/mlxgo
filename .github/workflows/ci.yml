name: CI

on:
  push:
  pull_request:

jobs:
  stub:
    name: Stub build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  native:
    name: Native mlx-c build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: brew install mlx-c
      - run: CGO_ENABLED=1 go test -tags mlx ./...
      - run: CGO_ENABLED=1 go vet -tags mlx ./...
